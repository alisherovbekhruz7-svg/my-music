<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music 🎵</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #4c1d95);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 30px 10px;
}

header h1 {
    font-size: 40px;
}

.search {
    display: block;
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    padding: 14px;
    border: none;
    border-radius: 25px;
    outline: none;
    font-size: 16px;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: auto;
}

.song {
    background: rgba(255,255,255,0.12);
    margin: 15px 0;
    padding: 15px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: 0.3s;
}

.song:hover {
    background: rgba(255,255,255,0.22);
    transform: scale(1.02);
}

.cover {
    width: 65px;
    height: 65px;
    border-radius: 12px;
    object-fit: cover;
}

.song-info {
    flex: 1;
}

.song-info h3 {
    margin-bottom: 6px;
}

.song-info p {
    color: #ccc;
}

button {
    border: none;
    background: #8b5cf6;
    color: white;
    padding: 12px 18px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #a78bfa;
}

.player {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111827;
    padding: 15px;
    text-align: center;
    box-shadow: 0 -5px 20px rgba(0,0,0,.4);
}

#currentSong {
    margin-bottom: 10px;
    font-weight: bold;
}

audio {
    width: 90%;
    max-width: 600px;
}
</style>
</head>

<body>

<header>
    <h1>🎵 My Music</h1>
    <p>Sevimli qo‘shiqlaringni tingla</p>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 Qo‘shiq qidirish..."
    >
</header>

<div class="container">

    <div class="song">
        <img class="cover"
        src="https://picsum.photos/100?random=1">

        <div class="song-info">
            <h3>My Song 1</h3>
            <p>Artist 1</p>
        </div>

        <button onclick="playSong('music/song1.mp3','My Song 1')">
            ▶️ Play
        </button>
    </div>

    <div class="song">
        <img class="cover"
        src="https://picsum.photos/100?random=2">

        <div class="song-info">
            <h3>My Song 2</h3>
            <p>Artist 2</p>
        </div>

        <button onclick="playSong('music/song2.mp3','My Song 2')">
            ▶️ Play
        </button>
    </div>

    <div class="song">
        <img class="cover"
        src="https://picsum.photos/100?random=3">

        <div class="song-info">
            <h3>My Song 3</h3>
            <p>Artist 3</p>
        </div>

        <button onclick="playSong('music/song3.mp3','My Song 3')">
            ▶️ Play
        </button>
    </div>

</div>

<div class="player">

    <div id="currentSong">
        Hech narsa tanlanmagan
    </div>

    <audio id="audio" controls></audio>

</div>

<script>

const audio = document.getElementById("audio");
const currentSong = document.getElementById("currentSong");

function playSong(file, name) {
    audio.src = file;
    currentSong.textContent = "🎵 " + name;
    audio.play();
}

// Qidiruv
document.getElementById("search").addEventListener("input", function() {

    let text = this.value.toLowerCase();

    document.querySelectorAll(".song").forEach(song => {

        let name = song
            .querySelector("h3")
            .textContent
            .toLowerCase();

        song.style.display =
            name.includes(text) ? "flex" : "none";

    });

});

</script>

</body>
</html>
